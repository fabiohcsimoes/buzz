name: HIVE Buzz - Validate and Publish

on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Publish an immutable Docker image after tests pass"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate HIVE relay change
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout HIVE relay feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feat/hive-notices-relay-20261023
          persist-credentials: false
      - name: Select exact source SHA and verify feature exists
        id: source
        shell: bash
        run: |
          grep -Fq 'BUZZ_SUPPRESS_DELETION_NOTICES' crates/buzz-relay/src/handlers/side_effects.rs
          grep -Fq 'deletion_notice_policy_tests' crates/buzz-relay/src/handlers/side_effects.rs
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Activate Buzz pinned toolchain
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test deletion notice policy
        run: cargo test --locked -p buzz-relay --lib deletion_notice_policy_tests -- --nocapture

  publish:
    name: Publish image to GHCR
    if: ${{ inputs.publish_image }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exactly the tested revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - name: Check tested commit
        env:
          TESTED_SHA: ${{ needs.validate.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Buzz relay
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/fabiohcsimoes/buzz:hive-notices-${{ needs.validate.outputs.source_sha }}
          build-args: |
            BUZZ_SOURCE_SHA=${{ needs.validate.outputs.source_sha }}
          cache-from: type=gha,scope=hive-relay-notices
          cache-to: type=gha,mode=max,scope=hive-relay-notices
      - name: Record immutable deployment artifact
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Tested Buzz relay image"
            echo ""
            echo "Image: \`ghcr.io/fabiohcsimoes/buzz:hive-notices-$SOURCE_SHA\`"
            echo "Digest: \`$IMAGE_DIGEST\`"
            echo ""
            echo "Production Railway service was NOT changed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
