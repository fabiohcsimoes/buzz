name: HIVE relay deletion notice policy
on:
  push:
    branches:
      - feat/hive-notices-relay-20261023
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Activate pinned toolchain
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Build and run scoped policy tests
        run: cargo test --locked -p buzz-relay --lib deletion_notice_policy_tests -- --nocapture
